model:
  target: Models.autoregressive_diffusion.armd.ARMD
  params:
    seq_length: 12
    forecast_horizon: 12
    feature_size: 24
    timesteps: 12
    sampling_timesteps: 12
    loss_type: 'l1'
    beta_schedule: 'cosine'

solver:
  base_lr: 1.0e-3
  max_epochs: 2000
  results_folder: ./Checkpoints_my_task
  gradient_accumulate_every: 2
  save_cycle: 1800
  ema:
    decay: 0.995
    update_interval: 10

  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 4000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500
      verbose: False

dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: Amod2
      # Use every 24-month training window available through 2017-12.
      proportion: 1.0
      data_root: ./Data/datasets/ETTh1.csv
      window: 24
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: train

  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: Amod2
      proportion: 1.0
      data_root: ./Data/datasets/ETTh1.csv
      window: 24
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: test
      style: separate
      distribution: geometric
    coefficient: 1.0e-2
    step_size: 5.0e-2
    sampling_steps: 200

  batch_size: 16
  sample_size: 64
  shuffle: True
